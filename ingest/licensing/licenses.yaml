# Canonical licence allowlist for the ingestion gate.
#
# THIS FILE IS THE ALLOWLIST. If a licence is not described here, the gate
# REJECTS the item. There is no fallback, no "probably fine", no inference from
# which collection an item happened to sit in.
#
# Rationale (see docs/licensing-policy.md): this catalog's entire value is that a
# caller — very often an automated pipeline with no human in the loop — does not
# have to verify rights per item. If we admit something restrictive or unlabelled
# and present it as cleared, we are the party vouching for a false claim. A script
# calling auto_broll() cannot honour a promise not to monetise, so "the user said
# they wouldn't" can never be part of the safety argument.
#
# ---------------------------------------------------------------------------
# ADDING A LICENCE: this is a security-relevant change. A PR editing this file
# needs an explanation of why the licence imposes no condition that an automated,
# commercial, unattended consumer could unknowingly violate. Attribution is a
# condition a machine CAN honour (we render it); ShareAlike, NonCommercial and
# NoDerivatives are not.
# ---------------------------------------------------------------------------

tiers:
  public_domain:
    description: >-
      No conditions on reuse of any kind. Safe for an unattended commercial
      pipeline with zero downstream obligations.
    requires_attribution: false

  attribution:
    description: >-
      Free for commercial use and derivatives, but a credit line must be
      reproduced. Machine-honourable: we pre-render the credit string at ingest
      so a consumer can emit it without parsing anything.
    requires_attribution: true

licenses:

# Matching is EXACT, never fuzzy. Each licence lists the identifiers it accepts
# (`match_ids`), the URL fragments that identify it (`match_urls`), and the
# free-text phrases that do (`match_tokens`). There is no prefix or
# substring-of-identifier fallback: an earlier version of the gate mapped the
# generic token "pd" onto PDM-1.0 by prefix, which recorded a specific licence
# the source had never claimed. Guessing which licence a source meant is exactly
# the interpretation the gate exists to avoid.
#
# `match_tokens` is the weakest signal and is deliberately empty for licences
# whose names appear in ordinary prose (a caption reading "not in the public
# domain" must never match a licence).

  - id: CC0-1.0
    tier: public_domain
    name: Creative Commons Zero v1.0 Universal
    url: https://creativecommons.org/publicdomain/zero/1.0/
    match_ids: ["cc0", "cc0-1.0", "cc-0"]
    match_urls:
      - creativecommons.org/publicdomain/zero/1.0
    match_tokens: ["cc0", "cc-0", "cc zero"]

  - id: PDM-1.0
    tier: public_domain
    name: Public Domain Mark 1.0
    url: https://creativecommons.org/publicdomain/mark/1.0/
    # NOTE: "pdm" only. Bare "pd" is NOT this licence — see PD-GENERIC below.
    match_ids: ["pdm", "pdm-1.0"]
    match_urls:
      - creativecommons.org/publicdomain/mark/1.0
    match_tokens: ["pdm", "public domain mark"]

  - id: CC-PDD
    tier: public_domain
    name: Creative Commons Public Domain Dedication and Certification (retired)
    url: https://creativecommons.org/licenses/publicdomain/
    # CC's pre-CC0 public domain dedication. Retired in 2009 and superseded by
    # CC0, but still in wide use on older archive.org uploads — measured on 12%
    # of a Prelinger Archives sample, where it was the ONLY licence signal
    # present. Without this entry those items are rejected for carrying an
    # unrecognised licence, which is the gate working correctly on an allowlist
    # that was simply missing a real dedication.
    #
    # Distinct id rather than folding into PDM-1.0 or CC0-1.0: it is a
    # different instrument, and the catalog records what the source claimed.
    match_ids: ["cc-pdd", "publicdomain"]
    match_urls:
      - creativecommons.org/licenses/publicdomain
    match_tokens: []

  - id: PD-GENERIC
    tier: public_domain
    name: Public domain (no specific instrument asserted)
    url: https://en.wikipedia.org/wiki/Public_domain
    # For sources that assert public domain status *structurally* without naming
    # a Creative Commons instrument — e.g. Wikimedia Commons' `License: pd`,
    # which covers works PD by expiry, by lack of notice, or by statute. This is
    # a large and legitimate share of genuinely free material, and mapping it
    # onto PDM-1.0 to avoid a new entry would be recording a false claim.
    #
    # Deliberately has NO match_tokens and NO match_urls: it is admissible only
    # from a source's STRUCTURED licence field, never from free text, because
    # the phrase "public domain" appears constantly in ordinary prose —
    # including in sentences denying that something is public domain.
    match_ids: ["pd", "publicdomain", "public-domain", "pd-us", "pd-old"]
    match_urls: []
    match_tokens: []

  - id: US-GOV
    tier: public_domain
    name: U.S. Federal Government work (17 U.S.C. §105)
    url: https://www.usa.gov/government-works
    # NOTE: this is a JURISDICTIONAL basis, not a licence grant, and it is only
    # valid for works authored by a federal employee in the course of duty. It is
    # NOT valid for third-party or contractor material that a federal agency
    # merely republished. Sources may only assert this via `explicit_license_id`
    # when the source itself makes that authorship claim per item.
    match_ids: ["us-gov", "usgov"]
    match_urls:
      - usa.gov/government-works
    match_tokens: []
    jurisdiction: US

  - id: CC-BY-4.0
    tier: attribution
    name: Creative Commons Attribution 4.0
    url: https://creativecommons.org/licenses/by/4.0/
    match_ids: ["cc-by-4.0", "by-4.0"]
    match_urls: ["creativecommons.org/licenses/by/4.0"]
    match_tokens: ["cc by 4.0", "cc-by-4.0"]

  - id: CC-BY-3.0
    tier: attribution
    name: Creative Commons Attribution 3.0
    url: https://creativecommons.org/licenses/by/3.0/
    match_ids: ["cc-by-3.0", "by-3.0"]
    match_urls: ["creativecommons.org/licenses/by/3.0"]
    match_tokens: ["cc by 3.0", "cc-by-3.0"]

  - id: CC-BY-2.0
    tier: attribution
    name: Creative Commons Attribution 2.0
    url: https://creativecommons.org/licenses/by/2.0/
    match_ids: ["cc-by-2.0", "by-2.0"]
    match_urls: ["creativecommons.org/licenses/by/2.0"]
    match_tokens: ["cc by 2.0", "cc-by-2.0"]

# ---------------------------------------------------------------------------
# Explicitly denied. These exist ONLY to produce a precise rejection reason in
# logs and tests. Removing an entry here does NOT admit the licence — the
# allowlist above is what admits. This list is documentation and diagnostics.
#
# The NC entry is the one that motivated this whole design: sampling the
# archive.org `nasa` collection found CC BY-NC 2.0 material sitting alongside
# genuine public domain works, with nothing in the standard metadata fields to
# distinguish them.
# ---------------------------------------------------------------------------
denied:
  - pattern: "creativecommons.org/licenses/by-nc"
    reason: "NonCommercial — our consumers monetise; serving this would hand them a violation"
  - pattern: "creativecommons.org/licenses/by-nd"
    reason: "NoDerivatives — cannot be cut, cropped, or edited into a video"
  - pattern: "creativecommons.org/licenses/by-sa"
    reason: "ShareAlike — imposes copyleft on the consumer's finished work"
  - pattern: "creativecommons.org/licenses/by-nc-sa"
    reason: "NonCommercial + ShareAlike"
  - pattern: "creativecommons.org/licenses/by-nc-nd"
    reason: "NonCommercial + NoDerivatives"
  - pattern: "rightsstatements.org/vocab/InC"
    reason: "In Copyright"
  - pattern: "rightsstatements.org/vocab/CNE"
    reason: "Copyright Not Evaluated — an explicit statement that nobody checked"
  - pattern: "all rights reserved"
    reason: "All rights reserved"
  - pattern: "fair use"
    reason: "Fair use is a defence, not a grant, and is not transferable to our consumers"
  - pattern: "educational use only"
    reason: "Use-restricted"
  - pattern: "personal use only"
    reason: "Use-restricted"
